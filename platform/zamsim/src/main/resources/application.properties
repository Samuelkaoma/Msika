spring.application.name=zamsim
server.port=8081

# Health at /health (not /actuator/health). Only health is exposed.
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health

# Own database, own user. The default is for local use only; see infra/.env.example.
spring.datasource.url=${ZAMSIM_DB_URL:jdbc:postgresql://localhost:5432/zamsim}
spring.datasource.username=zamsim
spring.datasource.password=${ZAMSIM_PASSWORD:dev_only_zamsim}

# /health reports each component, so you can see the database is up.
management.endpoint.health.show-components=always
