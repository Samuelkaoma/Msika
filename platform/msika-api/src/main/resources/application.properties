spring.application.name=msika-api
server.port=8080

# Health at /health (not /actuator/health). Only health is exposed.
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health

# Two database roles on purpose: Flyway connects as the owner (it creates tables), the running app
# connects as msika_app (it owns nothing and cannot bypass row-level security). The defaults are for
# local use only; see infra/.env.example.
spring.datasource.url=${MSIKA_DB_URL:jdbc:postgresql://localhost:5432/msika}
spring.datasource.username=msika_app
spring.datasource.password=${MSIKA_APP_PASSWORD:dev_only_msika_app}
spring.flyway.url=${MSIKA_DB_URL:jdbc:postgresql://localhost:5432/msika}
spring.flyway.user=msika_owner
spring.flyway.password=${MSIKA_OWNER_PASSWORD:dev_only_msika_owner}

# /health reports each component, so you can see the database is up.
management.endpoint.health.show-components=always

# Sign-in. Tokens are short-lived. The signing secret (msika.auth.jwt-secret, Base64, 32+ bytes) and
# the first operator (msika.bootstrap-operator.email and .password) are NEVER set here: this
# repository is public. Set them from the environment on a real server.
msika.auth.token-ttl=PT15M
msika.auth.bcrypt-strength=12

# The OpenAPI description (card M-26) at /v3/api-docs. Only the API, not the actuator.
springdoc.paths-to-match=/api/**
springdoc.api-docs.version=openapi_3_1
